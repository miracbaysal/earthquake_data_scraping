<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Türkiye Deprem Haritası</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson@3"></script>
<style>
body { background: #0a0a0a; color: white; font-family: Arial; text-align:center; }
svg { width: 100%; height: 90vh; }
.earthquake { stroke:white; stroke-width:0.3; opacity:0.8; cursor:pointer; }
.tooltip { position:absolute; padding:5px; background:rgba(0,0,0,0.8); color:white; border-radius:5px; font-size:13px; pointer-events:none; }

#colorlist {
  position: fixed;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.7);
  padding: 10px 15px;
  border-radius: 10px;
  list-style: none;
  font-size: 14px;
  text-align: left;
  z-index: 9999;
}
#colorlist li {
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}

/* Deprem renkleriyle aynı */
.red { background: red; }
.orange { background: orange; }
.pink { background: pink; }
.green { background: green; }

</style>
</head>
<body>

<ul id="colorlist">
  <li><span class="dot red"></span> >= 6.0</li>
  <li><span class="dot orange"></span> 4.1 - 5.9</li>
  <li><span class="dot pink"></span> 2.1 - 4.0</li>
  <li><span class="dot green"></span> 0.0 - 2.0</li>
</ul>


<h2>Türkiye Deprem Haritası</h2>

<button onclick="location.reload();">Verileri Yenile</button>
<button onclick="last100()">Son 100</button>
<button onclick="max10()">Büyük Depremler</button>

<div id="map"></div>
<div id="tooltip" class="tooltip" style="display:none;"></div>

<script>
function last100() {
    d3.json("scrapped_data_latest.json").then(data => {
        const last100 = data.slice(-100);
        svg.selectAll("circle").remove();
        svg.selectAll("circle")
          .data(last100)
          .enter()
          .append("circle")
          .attr("class","earthquake")
          .attr("cx", d => projection([d.boylam,d.enlem])[0])
          .attr("cy", d => projection([d.boylam,d.enlem])[1])
          .attr("r", d => d.ML!=="-" ? +d.ML*2 : 2)
          .attr("fill", d => { if (+d.ML > 6) return "red"; else if (+d.ML > 4)return "orange"; else if (+d.ML > 2)return "pink"; else return "green";})
          .call(zoom)
          .on("mouseover", function(event,d){
            tooltip.style("display","block")
                   .style("left",(event.pageX+10)+"px")
                   .style("top",(event.pageY-30)+"px")
                   .html(`<b>${d.yer}</b><br>Büyüklük: ${d.ML}<br>Derinlik: ${d.derinlik_km} km<br>${d.tarih} ${d.saat}`);
          })
          .on("mouseout",()=>tooltip.style("display","none"));
    });
}
function max10(){
    d3.json("scrapped_data_latest.json").then(data => {
        const max10 = data.sort((a,b) => +b.ML - +a.ML).slice(0,10);
        svg.selectAll("circle").remove();
        svg.selectAll("circle")
          .data(max10)
          .enter()
          .append("circle")
          .attr("class","earthquake")
          .attr("cx", d => projection([d.boylam,d.enlem])[0])
          .attr("cy", d => projection([d.boylam,d.enlem])[1])
          .attr("r", d => d.ML!=="-" ? +d.ML*2 : 2)
          .attr("fill", d => { if (+d.ML > 6) return "red"; else if (+d.ML > 4)return "orange"; else if (+d.ML > 2)return "pink"; else return "green";})
          .call(zoom)
          .on("mouseover", function(event,d){
            tooltip.style("display","block")
                   .style("left",(event.pageX+10)+"px")
                   .style("top",(event.pageY-30)+"px")
                   .html(`<b>${d.yer}</b><br>Büyüklük: ${d.ML}<br>Derinlik: ${d.derinlik_km} km<br>${d.tarih} ${d.saat}`);
          })
          .on("mouseout",()=>tooltip.style("display","none"));
    });
}
const width = window.innerWidth;
const height = window.innerHeight*0.85;

const svg = d3.select("#map")
                .append("svg")
                .attr("width", width)
                .attr("height", height);

const projection = d3.geoMercator()
                        .center([35,39])
                        .scale(2500)
                        .translate([width/2,height/2]);

const path = d3.geoPath()
                .projection(projection);
                
const tooltip = d3.select("#tooltip");

const zoom = d3
          .zoom()
          .scaleExtent([1, 8])
          .on("zoom", (event) => {
            const { transform } = event;
            mapGroup.attr("transform", transform);
            mapGroup
              .selectAll("circle")
              .attr("r", (d) =>
                d.ML ? (d.ML * 3.5) / transform.k : 3 / transform.k
              );
          });


// var zoom = d3.zoom()
//     .scaleExtent([1, 15])
//     .translateExtent([[0, 0], [width, height]])
//     .on("zoom", function(event) {
//         svg.selectAll("path").attr("transform", event.transform);
//         svg.selectAll("circle").attr("transform", event.transform);
//     });

// GeoJSON Türkiye haritası
d3.json("turkey.json").then(turkey => {
    svg.selectAll("path")
        .data(turkey.features)  // <- GeoJSON için features direkt kullanılabilir
        .enter().append("path")
        .attr("d", path)
        .attr("fill","#1a1a1a")
        .attr("stroke","#444")
        .call(zoom)
        

  // Deprem verilerini JSON’dan al
  d3.json("scrapped_data_latest.json").then(data => {
    svg.selectAll("circle")
      .data(data)
      .enter()
      .append("circle")
      .attr("class","earthquake")
      .attr("cx", d => projection([d.boylam,d.enlem])[0])
      .attr("cy", d => projection([d.boylam,d.enlem])[1])
      .attr("r", d => d.ML!=="-" ? +d.ML*2 : 2)
      // .attr("fill", d => +d.ML>4 ? "red":"orange" && +d.ML>2 ? "orange":"green")
      .attr("fill", d => { if (+d.ML > 6) return "red"; else if (+d.ML > 4)return "orange"; else if (+d.ML > 2)return "pink"; else return "green";})
      .call(zoom)
      .on("mouseover", function(event,d){
        tooltip.style("display","block")
               .style("left",(event.pageX+10)+"px")
               .style("top",(event.pageY-30)+"px")
               .html(`<b>${d.yer}</b><br>Büyüklük: ${d.ML}<br>Derinlik: ${d.derinlik_km} km<br>${d.tarih} ${d.saat}`);
      })
      
      .on("mouseout",()=>tooltip.style("display","none"));
  });
});



</script>
</body>
</html>
